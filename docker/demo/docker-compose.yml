# The read-only MapGrid demo from the published image.
#
#   KEY=... SECRET=... ADMIN_PASSWORD=... PUBLIC_URL=https://your.domain docker compose up -d
#
# Visitors sign in as publico@example.com / senha-publica (shown on the login
# page); only the admin can change anything. Nothing is kept on disk: every
# restart starts from a fresh database and the seed loads the demo again.
name: mapgrid-demo

services:
  database:
    image: postgis/postgis:15-3.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mapgrid-demo-db}
    healthcheck:
      # over TCP: while the image initialises, the socket answers too early
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U directus -d directus']
      interval: 5s
      timeout: 5s
      retries: 30

  directus:
    image: ${MAPGRID_IMAGE:-sidartaveloso/directus-mapgrid:latest}
    restart: unless-stopped
    ports:
      - '${PORT:-8055}:8055'
    environment:
      KEY: ${KEY:?set KEY to a long random string}
      SECRET: ${SECRET:?set SECRET to a long random string}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DB_PASSWORD:-mapgrid-demo-db}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
    depends_on:
      database:
        condition: service_healthy
