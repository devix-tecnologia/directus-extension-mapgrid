# The throwaway stack docker/demo/bake.sh seeds. Not for running the demo:
# see docker-compose.yml for that.
services:
  database:
    image: postgis/postgis:15-3.3-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${BAKE_DB_PASSWORD}
      # outside the image's VOLUME, so the data can go into an image layer
      PGDATA: /var/lib/postgresql/mapgrid
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U directus -d directus']
      interval: 5s
      timeout: 5s
      retries: 60

  directus:
    image: ${BAKE_DIRECTUS_IMAGE:-sidartaveloso/directus-mapgrid:2.0.0}
    environment:
      KEY: ${BAKE_KEY}
      SECRET: ${BAKE_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${BAKE_DB_PASSWORD}
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ${BAKE_ADMIN_PASSWORD}
      ACCEPT_TERMS: 'true'
    volumes:
      - ./build/mapgrid-demo-seed.mjs:/directus/mapgrid-demo-seed.mjs:ro
    depends_on:
      database:
        condition: service_healthy
