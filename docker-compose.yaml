services:
    database:
        image: postgis/postgis:15-3.3-alpine
        volumes:
            - db_data:/var/lib/postgresql/data
        restart: unless-stopped
        environment:
            - POSTGRES_DB=directus
            - POSTGRES_USER=directus
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-directus-dev-only}
        ports:
            - ${DATABASE_PORT:-5432}:5432
        networks:
            - directus-network

    pgadmin:
        image: dpage/pgadmin4:latest
        volumes:
            - pgadmin4_data:/var/lib/pgadmin
        environment:
            - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-dev@localhost}
            - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-directus-dev-only}
        restart: unless-stopped
        depends_on:
            - database
        ports:
            - ${PGADMIN_PORT:-16543}:80
        networks:
            - directus-network

    directus:     
        image: directus/directus:${DIRECTUS_VERSION:-11.5.1}
        environment:
          KEY: "${DIRECTUS_KEY:-directus-dev-key-not-a-secret}"
          SECRET: "${DIRECTUS_SECRET:-directus-dev-secret-not-a-secret-0123456789}"

          EXTENSIONS_AUTO_RELOAD: "true"

          DB_CLIENT: "pg"
          DB_HOST: "database"
          DB_PORT: "5432"
          DB_DATABASE: "directus"
          DB_USER: "directus"
          DB_PASSWORD: "${DB_PASSWORD:-directus-dev-only}"

          CORS_ENABLED: "true"
          CORS_ORIGIN: "true"
          CORS_CREDENTIALS: "true"

          ADMIN_EMAIL: "dev@devix.co"
          ADMIN_PASSWORD: "${ADMIN_PASSWORD:-directus-dev-only}"

          PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8055}"
          CACHE_ENABLED: "false"
        ports:
            - ${DIRECTUS_PORT:-8055}:8055
        volumes:
            - .:/directus/extensions/directus-extension-mapgrid
        depends_on:
            - database

        networks:
            - directus-network        
        restart: unless-stopped   

volumes:
    db_data:
    pgadmin4_data:

networks:
    directus-network:
        driver: bridge
