name: directus-extension-mapgrid-test

services:
  database:
    image: postgis/postgis:15-3.3-alpine
    container_name: directus-mapgrid-db-${TEST_SUITE_ID:-main}-${DIRECTUS_VERSION:-latest}
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256M,mode=777
    networks:
      - mapgrid-directus-test-network
    healthcheck:
      # -h 127.0.0.1 forces TCP on purpose. During initdb the entrypoint starts
      # a temporary server with an empty listen_addresses, answering only on the
      # Unix socket — and a pg_isready without a host replies "ready" there,
      # before the port exists. Directus then connected over TCP, got
      # ECONNREFUSED and died, taking the e2e pipeline down every other run.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U directus -d directus']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  directus:
    image: directus/directus:${DIRECTUS_VERSION:-10.13.1}
    container_name: directus-mapgrid-${TEST_SUITE_ID:-main}-${DIRECTUS_VERSION:-latest}
    ports:
      - '${DIRECTUS_PORT:-0}:8055'
    environment:
      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: 'directus'
      KEY: 'test-key-that-is-at-least-32-bytes'
      SECRET: 'test-secret-that-is-at-least-32-bytes'
      ADMIN_EMAIL: 'admin@example.com'
      ADMIN_PASSWORD: 'admin123'
      STATIC_TOKEN: 'test-static-token'
      PUBLIC_URL: ${PUBLIC_URL:-http://directus:8055}
      STORAGE_LOCAL_ROOT: '/directus/uploads'
      EXTENSIONS_PATH: '/directus/extensions'
      EXTENSIONS_AUTO_RELOAD: 'true'
      PERMISSIONS_CACHE_TTL: '0'
      CACHE_ENABLED: 'false'
      ACCEPT_TERMS: 'true'
      PROJECT_OWNER: 'admin@example.com'
      PRESSURE_LIMITER_ENABLED: 'false'
      LOG_LEVEL: 'warn'
      # Headroom on the connection pool. On a machine busy with other stacks,
      # Directus died at boot with "Knex: Timeout acquiring a connection" before
      # even answering the first health check — and the whole suite fell for
      # that, not for what it measures. The defaults are tight for a host under
      # load; these double the patience without changing behaviour elsewhere.
      DB_POOL__MIN: '1'
      DB_POOL__MAX: '10'
      DB_POOL__ACQUIRE_TIMEOUT_MILLIS: '120000'
      DB_POOL__CREATE_TIMEOUT_MILLIS: '60000'
    volumes:
      - ./dist/index.js:/directus/extensions/directus-extension-mapgrid/dist/index.js:ro
      - ./package.json:/directus/extensions/directus-extension-mapgrid/package.json:ro
    tmpfs:
      - /directus/uploads:rw,noexec,nosuid,size=64M,mode=777
    depends_on:
      database:
        condition: service_healthy
    networks:
      - mapgrid-directus-test-network
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - |
          wget --no-verbose --tries=1 --spider http://0.0.0.0:8055/server/health
      interval: 5s
      timeout: 10s
      retries: 50
      start_period: 60s

  # The test runner, on the same network.
  #
  # Runs Playwright in a container instead of on the machine, and reaches
  # Directus by service name — `http://directus:8055` — without depending on a
  # port published on the host. In an environment that cannot see the published
  # port this is the only way; and even where it can, it removes the dependence
  # on which port Docker drew. Approach borrowed from directus-extension-inframe.
  #
  # Installation happens inside the container because the machine's
  # node_modules is for another architecture and system, and does not work on
  # the image's Linux.
  #
  # The pnpm version is pinned on purpose, not left to corepack: corepack pulls
  # the latest, and pnpm 12 enforces a minimum publish-age policy that rejects
  # the lockfile whenever any transitive dependency was published in the last
  # few hours. Pinning to the same version as the machine makes the container
  # install exactly what the lockfile describes.
  tests:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    container_name: directus-mapgrid-tests-${TEST_SUITE_ID:-main}-${DIRECTUS_VERSION:-latest}
    profiles: ['runner']
    environment:
      CI: 'true'
      DIRECTUS_URL: 'http://directus:8055'
      # `e2e` runs the suite; `screenshot` regenerates docs/tela.jpg
      RUNNER_CMD: ${RUNNER_CMD:-e2e}
      # When present, the capture also records the task's evidence in
      # TASKS/assets, as task-NNN-<label>-<moment>.png
      EVIDENCE_TASK: ${EVIDENCE_TASK:-}
      EVIDENCE_LABEL: ${EVIDENCE_LABEL:-}
      EVIDENCE_MOMENT: ${EVIDENCE_MOMENT:-}
      # Extra Playwright arguments, to capture one evidence spec instead of all
      # of them: every evidence spec reads EVIDENCE_TASK, so a plain run writes
      # a file for each of them under the same task number. The e2e takes them
      # too, to run the one spec a measurement is about.
      RUNNER_ARGS: ${RUNNER_ARGS:-}
    depends_on:
      directus:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace:rw
      # Named volumes covering node_modules and the pnpm store.
      #
      # node_modules must be covered because `pnpm install` from inside the
      # container would write over the machine's, swapping the binaries for
      # Linux versions and breaking every local command afterwards — that is
      # what happened on the first attempt, with `directus-extension: command
      # not found` on the following run.
      #
      # Named rather than anonymous so they survive `--rm`: with an anonymous
      # volume every run reinstalled the 919 packages from scratch, which
      # dominated the total time.
      - mapgrid-test-node-modules:/workspace/node_modules
      - mapgrid-test-pnpm-store:/root/.local/share/pnpm/store
      - /dev/shm:/dev/shm
    networks:
      - mapgrid-directus-test-network
    command:
      - bash
      - -lc
      - |
        npm i -g pnpm@10.15.0 && \
        pnpm install --frozen-lockfile && \
        if [ "$$RUNNER_CMD" = "screenshot" ]; then
          pnpm exec playwright test --config=playwright.screenshot.config.ts $$RUNNER_ARGS
        else
          pnpm exec playwright test --config=playwright.config.ts $$RUNNER_ARGS
        fi

volumes:
  mapgrid-test-node-modules:
    name: directus-mapgrid-node-modules-${TEST_SUITE_ID:-main}
  mapgrid-test-pnpm-store:
    name: directus-mapgrid-pnpm-store-${TEST_SUITE_ID:-main}

networks:
  # The subnet is pinned on purpose, not left to docker.
  #
  # When docker draws, it usually lands on 172.18.0.0/16 — and on a machine
  # announcing an egress route on Tailscale, container traffic in that range is
  # swallowed: the name resolves, the ping never comes back and the connection
  # expires without an error. Directus then dies at boot with "Knex: Timeout
  # acquiring a connection", and the whole suite falls for a reason that has
  # nothing to do with what it measures. On a 10.x range the same test passes.
  mapgrid-directus-test-network:
    driver: bridge
    name: directus-mapgrid-test-${TEST_SUITE_ID:-main}-${DIRECTUS_VERSION:-latest}
    ipam:
      config:
        - subnet: ${TEST_SUBNET:-10.77.77.0/24}
