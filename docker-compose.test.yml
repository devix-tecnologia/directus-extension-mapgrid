services:
  database:
    image: postgis/postgis:15-3.3-alpine
    container_name: directus-mapgrid-db-${TEST_SUITE_ID:-main}-${DIRECTUS_VERSION:-latest}
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256M,mode=777
    networks:
      - mapgrid-directus-test-network
    healthcheck:
      # -h 127.0.0.1 forca TCP de proposito. Durante o initdb o entrypoint sobe
      # um servidor temporario com listen_addresses vazio, atendendo so no
      # socket Unix — e um pg_isready sem host responde "pronto" ali, antes de a
      # porta existir. O Directus entao conectava por TCP, levava ECONNREFUSED e
      # morria, derrubando o pipeline de e2e uma vez a cada duas.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U directus -d directus']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  directus:
    image: directus/directus:${DIRECTUS_VERSION:-10.13.1}
    container_name: directus-mapgrid-${TEST_SUITE_ID:-main}-${DIRECTUS_VERSION:-latest}
    ports:
      - '0:8055'
    environment:
      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: 'directus'
      KEY: 'test-key-that-is-at-least-32-bytes'
      SECRET: 'test-secret-that-is-at-least-32-bytes'
      ADMIN_EMAIL: 'admin@example.com'
      ADMIN_PASSWORD: 'admin123'
      STATIC_TOKEN: 'test-static-token'
      PUBLIC_URL: 'http://directus:8055'
      STORAGE_LOCAL_ROOT: '/directus/uploads'
      EXTENSIONS_PATH: '/directus/extensions'
      EXTENSIONS_AUTO_RELOAD: 'true'
      PERMISSIONS_CACHE_TTL: '0'
      CACHE_ENABLED: 'false'
      ACCEPT_TERMS: 'true'
      PROJECT_OWNER: 'admin@example.com'
      PRESSURE_LIMITER_ENABLED: 'false'
      LOG_LEVEL: 'warn'
    volumes:
      - ./dist/index.js:/directus/extensions/directus-extension-mapgrid/dist/index.js:ro
      - ./package.json:/directus/extensions/directus-extension-mapgrid/package.json:ro
    tmpfs:
      - /directus/uploads:rw,noexec,nosuid,size=64M,mode=777
    depends_on:
      database:
        condition: service_healthy
    networks:
      - mapgrid-directus-test-network
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - |
          wget --no-verbose --tries=1 --spider http://0.0.0.0:8055/server/health
      interval: 5s
      timeout: 10s
      retries: 50
      start_period: 60s

  # O runner dos testes, dentro da mesma rede.
  #
  # Roda o Playwright num container em vez de na maquina, e alcanca o Directus
  # pelo nome do servico — `http://directus:8055` — sem depender de porta
  # publicada no host. Em ambiente que nao enxerga a porta publicada, esse e o
  # unico caminho; e mesmo onde enxerga, remove a dependencia de qual porta o
  # Docker sorteou. Abordagem emprestada do directus-extension-inframe.
  #
  # A instalacao acontece dentro do container porque node_modules da maquina e
  # de outra arquitetura e sistema, e nao serve para o Linux da imagem.
  #
  # A versao do pnpm e fixada de proposito, e nao deixada a cargo do corepack:
  # o corepack baixa a mais recente, e a 12 aplica uma politica de idade minima
  # de publicacao que recusa o lockfile sempre que alguma dependencia transitiva
  # tiver sido publicada nas ultimas horas. Fixar na mesma versao da maquina faz
  # o container instalar exatamente o que o lockfile descreve.
  tests:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    container_name: directus-mapgrid-tests-${TEST_SUITE_ID:-main}-${DIRECTUS_VERSION:-latest}
    profiles: ['runner']
    environment:
      CI: 'true'
      DIRECTUS_URL: 'http://directus:8055'
      # `e2e` roda a suite; `screenshot` regenera docs/tela.jpg
      RUNNER_CMD: ${RUNNER_CMD:-e2e}
    depends_on:
      directus:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace:rw
      # Volumes nomeados cobrindo node_modules e o store do pnpm.
      #
      # O node_modules precisa ser coberto porque o `pnpm install` de dentro do
      # container escreveria por cima do da maquina, trocando os binarios por
      # versoes de Linux e quebrando todo comando local depois — foi o que
      # aconteceu na primeira tentativa, com `directus-extension: command not
      # found` na execucao seguinte.
      #
      # Sao nomeados, e nao anonimos, para sobreviverem ao `--rm`: com volume
      # anonimo cada execucao rebaixava os 919 pacotes do zero, o que dominava o
      # tempo total.
      - mapgrid-test-node-modules:/workspace/node_modules
      - mapgrid-test-pnpm-store:/root/.local/share/pnpm/store
      - /dev/shm:/dev/shm
    networks:
      - mapgrid-directus-test-network
    command:
      - bash
      - -lc
      - |
        npm i -g pnpm@10.15.0 && \
        pnpm install --frozen-lockfile && \
        if [ "$$RUNNER_CMD" = "screenshot" ]; then
          pnpm exec playwright test --config=playwright.screenshot.config.ts
        else
          pnpm exec playwright test --config=playwright.config.ts
        fi

volumes:
  mapgrid-test-node-modules:
    name: directus-mapgrid-node-modules-${TEST_SUITE_ID:-main}
  mapgrid-test-pnpm-store:
    name: directus-mapgrid-pnpm-store-${TEST_SUITE_ID:-main}

networks:
  mapgrid-directus-test-network:
    driver: bridge
    name: directus-mapgrid-test-${TEST_SUITE_ID:-main}-${DIRECTUS_VERSION:-latest}
